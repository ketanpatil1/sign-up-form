<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sign-up form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div class="main flex">
            <div class="image-sidebar flex">
                <div class="logo">
                    LOGO
                </div>
                <p>
                    Photo by <a href="https://unsplash.com/@eadesstudio">James Eades</a> on <a href="https://unsplash.com/photos/ice-berg-QCrDUYKGbp4">Unsplash</a>
                </p>
            </div>
            <div class="content flex">
                <div>
                    <h1>Embrace the Unknown</h1>
                    <p class="subtitle">The journey starts when you do.</p>
                </div>
                <form action="https://httpbin.org/post" method="post">
                    <div class="input flex">
                        <div>
                            <label for="name">NAME</label>
                            <input type="text" name="name" id="name" required />
                        </div>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email" required />
                        </div>
                        <div>
                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" name="phone" id="phone" required />
                        </div>
                        <div>
                            <label for="password">PASSWORD</label>
                            <input type="password" name="password" id="password" required />
                        </div>
                        <div>
                            <label for="confirm_password">CONFIRM PASSWORD</label>
                            <input type="password" name="confirm_password" id="confirm_password" required />
                        </div>
                    </div>
                    <button type="submit">Begin the Passage</button>
                </form>
                <p>Ready to cross back in? <a href="./login.html" id="login">Return</a></p>
            </div>
        </div>
    </body>
</html>
