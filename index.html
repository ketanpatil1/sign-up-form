<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sign-up form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div class="main">
            <div>
                <h1>Embrace the Unknown</h1>
                <p class="subtitle">The journey starts when you do.</p>
            </div>
            <form action="https://httpbin.org/post" method="post">
                <div>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" required />
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required />
                </div>
                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" name="phone" id="phone" pattern="^\+?[1-9]\d{1,14}$" required />
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required />
                </div>
                <div>
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" required />
                </div>
                <button type="submit">Begin the Passage</button>
            </form>
            <p>Ready to cross back in? <a href="./login.html" id="login">Return</a></p>
        </div>
    </body>
</html>
